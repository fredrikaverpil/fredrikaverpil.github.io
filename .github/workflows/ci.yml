name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [test, vulncheck]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: mise run ${{ matrix.task }}
